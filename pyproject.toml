[project]
name = "rackmon"
version = "1.0.0"
description = "Livestream rack monitoring: three kiosk dashboards for ATEM / OBS / PoE switch / PTZ cameras"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "psutil>=5.9",
    "Pillow>=10.0",
    "PyATEMMax",
    "simpleobsws>=1.4",
    "pysnmp>=6.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
rackmon = "rackmon.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rackmon*"]

[tool.setuptools.package-data]
"rackmon.web" = ["static/*", "static/**/*"]
